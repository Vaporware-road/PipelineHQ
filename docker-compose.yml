services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: forgecrm
      POSTGRES_USER: forgecrm
      POSTGRES_PASSWORD: forgecrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py setup_periodic_tasks &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: forgecrm
      POSTGRES_USER: forgecrm
      POSTGRES_PASSWORD: forgecrm
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-1}
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_DB: forgecrm
      POSTGRES_USER: forgecrm
      POSTGRES_PASSWORD: forgecrm
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-1}
    depends_on:
      - db
      - redis
      - web

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_DB: forgecrm
      POSTGRES_USER: forgecrm
      POSTGRES_PASSWORD: forgecrm
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-1}
    depends_on:
      - db
      - redis
      - web

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python manage.py run_telegram_bot
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_DB: forgecrm
      POSTGRES_USER: forgecrm
      POSTGRES_PASSWORD: forgecrm
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-1}
    depends_on:
      - web
      - redis
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Empty = browser calls same origin; Next rewrites /api → web (phone-friendly one-tunnel).
      # Override with a public API URL if you tunnel Django separately.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      API_PROXY_TARGET: http://web:8000
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    depends_on:
      - web

volumes:
  pgdata:
